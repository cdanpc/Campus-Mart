spring.application.name=technominds

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Option 1: H2 In-Memory Database (for development without MySQL)
# spring.datasource.url=jdbc:h2:mem:campusmart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Option 2: MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/campusmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=C0de2294
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# H2 CONSOLE (for development)
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=campusmart-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
jwt.expiration=86400000

# ============================================
# SERVER
# ============================================
server.port=8080
server.error.include-stacktrace=never